<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SI News — Driven by AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0b0f17; color: #e5e7eb; font-family: system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">
    <div>
        <!-- Header -->
        <header class="border-b border-gray-800 bg-gray-950/80 backdrop-blur sticky top-0 z-50">
            <div class="max-w-6xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
                <div>
                    <h1 class="text-2xl font-black tracking-wider text-cyan-400 flex items-center gap-2">
                        ⚡ SI NEWS <span class="text-[10px] font-normal px-2 py-0.5 rounded bg-cyan-950 text-cyan-300 border border-cyan-800">Driven by AI</span>
                    </h1>
                    <p id="subtitle" class="text-xs text-gray-400 mt-0.5">Autonom bevakning av globala AI-framsteg och utveckling</p>
                </div>
                
                <!-- Språkväljare -->
                <select id="langSelect" onchange="changeLanguage(this.value)" class="bg-gray-900 border border-gray-700 text-xs rounded px-3 py-1.5 text-gray-200 focus:outline-none focus:border-cyan-500">
                    <option value="sv">🇸🇪 Svenska</option>
                    <option value="en">🇬🇧 English</option>
                    <option value="es">🇪🇸 Español</option>
                    <option value="de">🇩🇪 Deutsch</option>
                </select>
            </div>
        </header>

        <!-- Main Content -->
        <main class="max-w-6xl mx-auto px-4 py-8 w-full">
            <!-- Kategorifilter -->
            <div class="flex flex-wrap gap-2 mb-8" id="categoryFilters">
                <button onclick="filterCategory('ALL', this)" class="cat-btn px-4 py-1.5 rounded-full text-xs font-semibold bg-cyan-500 text-gray-950 transition">Alla nyheter</button>
                <button onclick="filterCategory('AI-Modeller & AGI', this)" class="cat-btn px-4 py-1.5 rounded-full text-xs font-semibold bg-gray-900 text-gray-300 border border-gray-800 hover:border-gray-600 transition">AI-Modeller & AGI</button>
                <button onclick="filterCategory('Robotik & Fysiska system', this)" class="cat-btn px-4 py-1.5 rounded-full text-xs font-semibold bg-gray-900 text-gray-300 border border-gray-800 hover:border-gray-600 transition">Robotik</button>
                <button onclick="filterCategory('Vetenskap & Material', this)" class="cat-btn px-4 py-1.5 rounded-full text-xs font-semibold bg-gray-900 text-gray-300 border border-gray-800 hover:border-gray-600 transition">Vetenskap</button>
                <button onclick="filterCategory('Samhälle & Infrastruktur', this)" class="cat-btn px-4 py-1.5 rounded-full text-xs font-semibold bg-gray-900 text-gray-300 border border-gray-800 hover:border-gray-600 transition">Samhälle</button>
                <button onclick="filterCategory('Kod & Utveckling', this)" class="cat-btn px-4 py-1.5 rounded-full text-xs font-semibold bg-gray-900 text-gray-300 border border-gray-800 hover:border-gray-600 transition">Kod & Dev</button>
            </div>

            <!-- Nyhetsflöde -->
            <div id="newsContainer" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <p class="text-gray-500 text-sm col-span-2">Laddar in autonoma nyhetsflöden...</p>
            </div>
        </main>
    </div>

    <!-- Footer -->
    <footer class="border-t border-gray-900 bg-gray-950 py-6 text-center text-xs text-gray-500 mt-12">
        <p>SI News &copy; 2026 — Fully Autonomous AI News Engine.</p>
    </footer>

    <script>
        let allNews = [];
        let currentLang = 'sv';
        let currentCategory = 'ALL';

        const uiTexts = {
            sv: { subtitle: "Autonom bevakning av globala AI-framsteg och utveckling", readMore: "Läs originalartikel" },
            en: { subtitle: "Autonomous coverage of global AI advancements and development", readMore: "Read original article" },
            es: { subtitle: "Cobertura autónoma de los avances y el desarrollo global de la IA", readMore: "Leer artículo original" },
            de: { subtitle: "Autonome Berichterstattung über globale KI-Fortschritte und Entwicklung", readMore: "Originalartikel lesen" }
        };

        async function loadNews() {
            try {
                const response = await fetch('news.json?' + new Date().getTime());
                if (!response.ok) throw new Error("Kunde inte ladda databasen.");
                allNews = await response.json();
                renderNews();
            } catch (error) {
                document.getElementById('newsContainer').innerHTML = `<p class="text-gray-500 text-sm col-span-2">Sidan väntar på sin första automatiska nyhetshämtning.</p>`;
            }
        }

        function changeLanguage(lang) {
            currentLang = lang;
            document.getElementById('subtitle').innerText = uiTexts[lang].subtitle;
            renderNews();
        }

        function filterCategory(cat, btn) {
            currentCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(b => {
                b.className = "cat-btn px-4 py-1.5 rounded-full text-xs font-semibold bg-gray-900 text-gray-300 border border-gray-800 hover:border-gray-600 transition";
            });
            if (btn) {
                btn.className = "cat-btn px-4 py-1.5 rounded-full text-xs font-semibold bg-cyan-500 text-gray-950 transition";
            }
            renderNews();
        }

        function renderNews() {
            const container = document.getElementById('newsContainer');
            container.innerHTML = '';

            const filtered = allNews.filter(item => currentCategory === 'ALL' || item.category === currentCategory);

            if (filtered.length === 0) {
                container.innerHTML = `<p class="text-gray-500 text-sm col-span-2">Inga nyheter i denna kategori ännu.</p>`;
                return;
            }

            filtered.forEach(item => {
                const t = item.translations[currentLang] || item.translations['en'] || {};
                
                let mediaHtml = '';
                if (item.is_video && item.video_id) {
                    mediaHtml = `
                        <div class="mb-4 aspect-video w-full rounded overflow-hidden bg-black">
                            <iframe class="w-full h-full" src="https://www.youtube.com/embed/${item.video_id}" frameborder="0" allowfullscreen></iframe>
                        </div>
                    `;
                }

                const card = document.createElement('div');
                card.className = "bg-gray-900/40 border border-gray-800/80 rounded-lg p-5 flex flex-col justify-between hover:border-cyan-500/40 transition";
                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-center mb-3">
                            <span class="text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded bg-gray-800 text-cyan-400 border border-gray-700">${item.category}</span>
                            <span class="text-xs text-gray-400 font-mono">Impact: ${item.impact_score}/10</span>
                        </div>
                        ${mediaHtml}
                        <h3 class="text-base font-bold mb-2 text-gray-100 leading-snug">${t.title || 'Utan titel'}</h3>
                        <p class="text-sm text-gray-400 mb-4 leading-relaxed">${t.summary || ''}</p>
                    </div>
                    <div>
                        <a href="${item.source_url}" target="_blank" class="text-xs text-cyan-400 hover:text-cyan-300 font-semibold inline-flex items-center gap-1">
                            ${uiTexts[currentLang].readMore} &rarr;
                        </a>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        loadNews();
    </script>
</body>
</html>
