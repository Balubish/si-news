<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SI News - Autonom Nyhetskanal</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="border-b border-slate-800 bg-slate-950/80 backdrop-blur sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-2">
            <div class="flex items-center gap-3">
                <span class="inline-block w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></span>
                <h1 class="text-2xl font-bold tracking-tight text-white">SI <span class="text-emerald-400">NEWS</span></h1>
            </div>
            <div id="last-updated" class="text-xs text-slate-400 bg-slate-900 px-3 py-1.5 rounded-full border border-slate-800">
                Uppdaterar...
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-6xl mx-auto px-4 py-8 flex-grow w-full">
        <!-- Hero section -->
        <div class="mb-8">
            <h2 class="text-xl sm:text-2xl font-semibold text-slate-200">Senaste omvärldsnyheterna</h2>
            <p class="text-sm text-slate-400 mt-1">Autonomt kuraterat och sammanfattat med AI</p>
        </div>

        <!-- News Grid -->
        <div id="news-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Loading Skeletons -->
            <div class="bg-slate-800/50 border border-slate-800 rounded-xl p-5 animate-pulse h-64 flex flex-col justify-between">
                <div class="space-y-3">
                    <div class="h-4 bg-slate-700 rounded w-1/4"></div>
                    <div class="h-6 bg-slate-700 rounded w-3/4"></div>
                    <div class="h-4 bg-slate-700/50 rounded w-full"></div>
                    <div class="h-4 bg-slate-700/50 rounded w-2/3"></div>
                </div>
                <div class="h-4 bg-slate-700 rounded w-1/3 mt-4"></div>
            </div>
            <div class="bg-slate-800/50 border border-slate-800 rounded-xl p-5 animate-pulse h-64 flex flex-col justify-between hidden md:flex">
                <div class="space-y-3">
                    <div class="h-4 bg-slate-700 rounded w-1/4"></div>
                    <div class="h-6 bg-slate-700 rounded w-3/4"></div>
                    <div class="h-4 bg-slate-700/50 rounded w-full"></div>
                    <div class="h-4 bg-slate-700/50 rounded w-2/3"></div>
                </div>
                <div class="h-4 bg-slate-700 rounded w-1/3 mt-4"></div>
            </div>
            <div class="bg-slate-800/50 border border-slate-800 rounded-xl p-5 animate-pulse h-64 flex flex-col justify-between hidden lg:flex">
                <div class="space-y-3">
                    <div class="h-4 bg-slate-700 rounded w-1/4"></div>
                    <div class="h-6 bg-slate-700 rounded w-3/4"></div>
                    <div class="h-4 bg-slate-700/50 rounded w-full"></div>
                    <div class="h-4 bg-slate-700/50 rounded w-2/3"></div>
                </div>
                <div class="h-4 bg-slate-700 rounded w-1/3 mt-4"></div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-800 py-6 text-center text-xs text-slate-500 mt-12">
        <p>© SI News Engine — Drivs automatiskt av Python, Gemini API & GitHub Actions</p>
    </footer>

    <!-- Logic -->
    <script>
        async function loadNews() {
            const container = document.getElementById('news-container');
            const updatedTag = document.getElementById('last-updated');

            try {
                // Hämta news.json med cache-busting timestamp
                const response = await fetch('./news.json?t=' + new Date().getTime());
                
                if (!response.ok) {
                    throw new Error(`Kunde inte hämta nyheter (Status: ${response.status})`);
                }

                const data = await response.json();

                // Uppdatera tidsstämpel
                if (data.updated_at) {
                    updatedTag.textContent = `Senast uppdaterad: ${data.updated_at}`;
                } else {
                    updatedTag.textContent = 'Uppdaterad nyss';
                }

                // Rensa laddningsindikatorer
                container.innerHTML = '';

                if (!data.articles || data.articles.length === 0) {
                    container.innerHTML = `<div class="col-span-full text-center text-slate-400 py-12">Inga nyheter tillgängliga för tillfället.</div>`;
                    return;
                }

                // Bygg kort för varje artikel
                data.articles.forEach(article => {
                    const card = document.createElement('article');
                    card.className = "bg-slate-800/60 border border-slate-700/60 hover:border-emerald-500/50 transition-all duration-200 rounded-xl p-6 flex flex-col justify-between group shadow-lg";

                    card.innerHTML = `
                        <div>
                            <div class="flex items-center justify-between gap-2 mb-3">
                                <span class="text-xs font-semibold px-2.5 py-1 rounded-md bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                                    ${escapeHtml(article.category || 'Nyhet')}
                                </span>
                                <span class="text-xs text-slate-400 font-medium">
                                    ${escapeHtml(article.source || '')}
                                </span>
                            </div>
                            <h3 class="text-lg font-bold text-slate-100 group-hover:text-emerald-300 transition-colors mb-2 line-clamp-2">
                                ${escapeHtml(article.title)}
                            </h3>
                            <p class="text-slate-300 text-sm leading-relaxed mb-4">
                                ${escapeHtml(article.summary)}
                            </p>
                        </div>
                        <div class="pt-4 border-t border-slate-700/50 flex items-center justify-between">
                            <a href="${escapeHtml(article.url)}" target="_blank" rel="noopener noreferrer" 
                               class="inline-flex items-center gap-1.5 text-xs font-semibold text-emerald-400 hover:text-emerald-300 transition-colors">
                                Läs hela artikeln
                                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
                                </svg>
                            </a>
                        </div>
                    `;
                    container.appendChild(card);
                });

            } catch (error) {
                console.error('Fel vid laddning av nyheter:', error);
                updatedTag.textContent = 'Fel vid inläsning';
                container.innerHTML = `
                    <div class="col-span-full bg-red-900/20 border border-red-500/30 text-red-300 p-6 rounded-xl text-center">
                        <p class="font-semibold mb-1">Kunde inte ladda nyhetsflödet</p>
                        <p class="text-xs text-red-400">${error.message}</p>
                    </div>
                `;
            }
        }

        // Hjälpfunktion för att förhindra XSS
        function escapeHtml(str) {
            if (!str) return '';
            return str
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // Ladda nyheter när sidan öppnas
        document.addEventListener('DOMContentLoaded', loadNews);
    </script>
</body>
</html>
