<!DOCTYPE html>
<html lang="sv" data-theme="neon">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SI NEWS - Autonomous Feed</title>
    <style>
        /* Färgteman */
        :root[data-theme="neon"] {
            --bg-color: #0b1320; --card-bg: #131d31; --text-main: #f0f0f0; 
            --text-muted: #8a99ad; --accent: #00d2ff; --accent-hover: #00a3cc;
            --widget-bg: #090e18;
        }
        :root[data-theme="oled"] {
            --bg-color: #000000; --card-bg: #0a0a0a; --text-main: #ffffff; 
            --text-muted: #888888; --accent: #ffffff; --accent-hover: #cccccc;
            --widget-bg: #141414;
        }
        :root[data-theme="midnight"] {
            --bg-color: #0f172a; --card-bg: #1e293b; --text-main: #f8fafc; 
            --text-muted: #94a3b8; --accent: #38bdf8; --accent-hover: #0284c7;
            --widget-bg: #334155;
        }
        :root[data-theme="cyberpunk"] {
            --bg-color: #2d0b3b; --card-bg: #4a154b; --text-main: #fdf8ff; 
            --text-muted: #d8b4e2; --accent: #ff00ea; --accent-hover: #c900b8;
            --widget-bg: #5c1b5d;
        }
        :root[data-theme="light"] {
            --bg-color: #f8f9fa; --card-bg: #ffffff; --text-main: #212529; 
            --text-muted: #6c757d; --accent: #0056b3; --accent-hover: #004085;
            --widget-bg: #e9ecef;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            transition: background-color 0.3s, color 0.3s;
        }

        /* Header */
        header {
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            position: relative;
        }
        h1 { margin: 0; font-size: 24px; color: var(--accent); }
        .live-indicator {
            display: inline-block; width: 8px; height: 8px; 
            background-color: var(--accent); border-radius: 50%;
            box-shadow: 0 0 8px var(--accent);
            animation: pulse 2s infinite; margin-right: 8px;
        }
        @keyframes pulse { 0% {opacity: 1;} 50% {opacity: 0.4;} 100% {opacity: 1;} }
        
        .settings-btn {
            position: absolute; top: 20px; right: 20px; 
            background: none; border: none; font-size: 24px; 
            cursor: pointer; color: var(--text-main);
        }

        /* Widgets (Väder & Börs) */
        .widget-bar {
            display: flex; flex-wrap: wrap; justify-content: center; gap: 15px;
            padding: 12px 20px; background-color: var(--widget-bg); font-size: 13px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .widget-item { display: flex; align-items: center; gap: 6px; }
        .positive { color: #00e676; font-weight: bold; }
        .negative { color: #ff5252; font-weight: bold; }

        /* Kategori-Nav */
        .category-nav {
            display: flex; gap: 10px; overflow-x: auto; padding: 15px 20px;
            scrollbar-width: none; white-space: nowrap; max-width: 900px; margin: 0 auto;
        }
        .category-nav::-webkit-scrollbar { display: none; }
        .cat-btn {
            background-color: var(--card-bg); color: var(--text-muted);
            border: 1px solid rgba(255,255,255,0.05); padding: 8px 16px; 
            border-radius: 20px; cursor: pointer; font-weight: bold;
            transition: all 0.2s;
        }
        .cat-btn.active {
            color: var(--bg-color); background-color: var(--accent);
        }

        /* Container */
        .container { max-width: 800px; margin: 0 auto; padding: 0 20px 20px 20px; }

        /* AI Brief Top 3 Section */
        .ai-brief-box {
            background: var(--card-bg);
            border: 2px solid var(--accent);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .ai-brief-header {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 10px;
        }
        .ai-brief-title { font-size: 16px; font-weight: bold; color: var(--accent); margin: 0; }
        .brief-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; }
        .brief-item {
            background: rgba(0,0,0,0.2); padding: 12px; border-radius: 8px;
            border-left: 3px solid var(--accent); cursor: pointer; transition: background 0.2s;
        }
        .brief-item:hover { background: rgba(0,0,0,0.35); }
        .brief-item-cat { font-size: 10px; text-transform: uppercase; color: var(--accent); letter-spacing: 0.5px; }
        .brief-item-title { font-size: 13px; font-weight: bold; margin: 5px 0 0 0; line-height: 1.3; }

        /* Nyhetskort */
        .news-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            margin-bottom: 20px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.2s, border-color 0.2s;
            border: 1px solid rgba(255,255,255,0.05);
            display: flex; flex-direction: column;
        }
        .news-card:hover {
            transform: translateY(-2px);
            border-color: var(--accent);
        }
        
        .card-image {
            width: 100%; height: 200px; object-fit: cover;
            background-color: #333; display: block;
        }
        
        .card-content { padding: 20px; }
        
        .card-meta {
            display: flex; justify-content: space-between; align-items: center;
            font-size: 12px; color: var(--text-muted); margin-bottom: 10px;
        }
        .category-pill {
            background: rgba(255,255,255,0.1); padding: 4px 8px; border-radius: 4px; color: var(--accent);
        }
        
        .news-title { margin: 0 0 10px 0; font-size: 18px; line-height: 1.4; }
        .news-summary { font-size: 15px; line-height: 1.6; margin-bottom: 15px; color: var(--text-muted); }
        .news-summary strong { color: var(--text-main); }
        
        .why-it-matters {
            font-size: 14px; font-style: italic; color: var(--text-main);
            background: rgba(0,0,0,0.15); padding: 10px; border-left: 3px solid var(--accent);
            margin-bottom: 15px; border-radius: 0 4px 4px 0;
        }

        .card-actions {
            display: flex; justify-content: space-between; align-items: center;
            border-top: 1px solid rgba(255,255,255,0.05); padding-top: 15px;
        }
        .read-more, .save-btn {
            color: var(--accent); text-decoration: none; font-weight: bold; font-size: 14px; cursor: pointer;
            background: none; border: none; padding: 0;
        }
        .save-btn.saved { color: #ffd700; }

        /* Modal */
        .settings-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center;
        }
        .settings-content {
            background: var(--card-bg); padding: 30px; border-radius: 12px; width: 90%; max-width: 400px;
            border: 1px solid var(--accent);
        }
        .theme-select {
            width: 100%; padding: 10px; margin-top: 10px; background: var(--bg-color);
            color: var(--text-main); border: 1px solid var(--text-muted); border-radius: 4px;
        }
        .close-btn {
            background: var(--accent); color: var(--bg-color); border: none;
            padding: 10px 20px; border-radius: 4px; cursor: pointer; margin-top: 20px; width: 100%; font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <h1><span class="live-indicator"></span> SI NEWS</h1>
        <div style="font-size: 12px; color: var(--text-muted); margin-top: 5px;" id="update-time">Laddar flöde...</div>
        <button class="settings-btn" onclick="toggleSettings()">⚙️</button>
    </header>

    <!-- Väder & Börs Bar -->
    <div class="widget-bar">
        <div class="widget-item" id="weather-widget">📍 Norrköping: Hämtar väder...</div>
        <div style="opacity: 0.3;">|</div>
        <div class="widget-item">📈 OMXS30: <span class="positive">+0.4%</span></div>
        <div class="widget-item">🗽 S&P 500: <span class="positive">+0.2%</span></div>
        <div class="widget-item">💵 USD/SEK: 10.42 kr</div>
    </div>

    <!-- Kategori-Navigering -->
    <div class="category-nav" id="category-nav">
        <!-- Genereras dynamiskt -->
    </div>

    <div class="container">
        <!-- AI Brief Top 3 Section -->
        <div class="ai-brief-box" id="ai-brief-box">
            <div class="ai-brief-header">
                <h2 class="ai-brief-title">⚡ AI BRIEF – TOPP 3 JUST NU</h2>
                <span style="font-size: 11px; color: var(--text-muted);">Kuraterat av Gemini</span>
            </div>
            <div class="brief-grid" id="brief-grid">
                <!-- Fylls med topp 3 nyheter -->
            </div>
        </div>

        <!-- Huvudflöde av Nyheter -->
        <div id="news-container">
            <!-- Nyheter laddas här -->
        </div>
    </div>

    <!-- Inställningar Modal -->
    <div class="settings-modal" id="settings-modal">
        <div class="settings-content">
            <h2 style="margin-top:0;">Inställningar</h2>
            <label for="theme-select">Välj utseende (Skin):</label>
            <select class="theme-select" id="theme-select" onchange="changeTheme(this.value)">
                <option value="neon">Neon Dark (Standard)</option>
                <option value="oled">OLED Pure Black</option>
                <option value="midnight">Midnight Blue</option>
                <option value="cyberpunk">Cyberpunk Neon</option>
                <option value="light">Clean Light Mode</option>
            </select>
            <button class="close-btn" onclick="toggleSettings()">Stäng</button>
        </div>
    </div>

    <script>
        let allArticles = [];
        let savedArticles = JSON.parse(localStorage.getItem('si_saved_articles')) || [];

        // Tema-hantering
        const savedTheme = localStorage.getItem('si_theme') || 'neon';
        document.documentElement.setAttribute('data-theme', savedTheme);
        document.getElementById('theme-select').value = savedTheme;

        function changeTheme(themeName) {
            document.documentElement.setAttribute('data-theme', themeName);
            localStorage.setItem('si_theme', themeName);
        }

        function toggleSettings() {
            const modal = document.getElementById('settings-modal');
            modal.style.display = modal.style.display === 'flex' ? 'none' : 'flex';
        }

        function parseMarkdown(text) {
            if (!text) return "";
            return text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
        }

        // Hämta väder för Norrköping (Open-Meteo API)
        async function fetchWeather() {
            try {
                const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=58.59&longitude=16.18&current_weather=true');
                const data = await res.json();
                const temp = Math.round(data.current_weather.temperature);
                const code = data.current_weather.weathercode;
                
                let icon = '🌤️';
                if (code === 0) icon = '☀️';
                else if (code >= 1 && code <= 3) icon = '⛅';
                else if (code >= 45 && code <= 48) icon = '🌫️';
                else if (code >= 51 && code <= 67) icon = '🌧️';
                else if (code >= 71 && code <= 77) icon = '❄️';
                else if (code >= 80) icon = '🌧️';

                document.getElementById('weather-widget').innerHTML = `📍 Norrköping: ${icon} ${temp}°C`;
            } catch (e) {
                document.getElementById('weather-widget').innerHTML = `📍 Norrköping: 14°C ⛅`;
            }
        }

        async function fetchNews() {
            try {
                const response = await fetch(`news.json?t=${new Date().getTime()}`);
                const data = await response.json();
                
                allArticles = data.articles;
                document.getElementById('update-time').innerText = `Senast uppdaterad: ${data.updated_at || 'Nyligen'}`;
                
                setupCategories();
                renderAIBrief();
                renderArticles('Alla');
            } catch (error) {
                document.getElementById('news-container').innerHTML = `<p style="color:red; text-align:center;">Kunde inte hämta nyheter. Kontrollera news.json.</p>`;
            }
        }

        function renderAIBrief() {
            const grid = document.getElementById('brief-grid');
            grid.innerHTML = '';

            const top3 = allArticles.slice(0, 3);
            top3.forEach((art, index) => {
                grid.innerHTML += `
                    <div class="brief-item" onclick="scrollToArticle('${art.url}')">
                        <div class="brief-item-cat">#${index + 1} ${art.category || 'Nyhet'}</div>
                        <div class="brief-item-title">${art.title}</div>
                    </div>
                `;
            });
        }

        function scrollToArticle(url) {
            const target = document.getElementById(btoa(url));
            if (target) {
                target.scrollIntoView({ behavior: 'smooth', block: 'center' });
                target.style.borderColor = 'var(--accent)';
                setTimeout(() => target.style.borderColor = 'rgba(255,255,255,0.05)', 2000);
            }
        }

        function setupCategories() {
            const nav = document.getElementById('category-nav');
            
            // AI Utveckling agerar nu huvudflik för ALLT som rör AI, AGI, SI och Robotar
            const priorityCategories = ['Alla', 'Sparade', 'AI Utveckling', 'Sverige', 'Världen', 'Ekonomi', 'Teknik', 'Klimat'];
            
            const jsonCategories = allArticles.map(a => a.category).filter(Boolean);
            const categories = [...new Set([...priorityCategories, ...jsonCategories])];
            
            nav.innerHTML = categories.map(cat => 
                `<button class="cat-btn ${cat === 'Alla' ? 'active' : ''}" onclick="filterCategory('${cat}', this)">${cat}</button>`
            ).join('');
        }

        function filterCategory(category, btnElement) {
            document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
            if(btnElement) btnElement.classList.add('active');
            
            const briefBox = document.getElementById('ai-brief-box');
            if (category === 'Alla') {
                briefBox.style.display = 'block';
            } else {
                briefBox.style.display = 'none';
            }

            renderArticles(category);
        }

        function toggleSave(url, btnElement) {
            if (savedArticles.includes(url)) {
                savedArticles = savedArticles.filter(saved => saved !== url);
                btnElement.classList.remove('saved');
                btnElement.innerText = '🔖 Spara';
            } else {
                savedArticles.push(url);
                btnElement.classList.add('saved');
                btnElement.innerText = '⭐ Sparad';
            }
            localStorage.setItem('si_saved_articles', JSON.stringify(savedArticles));
            
            const activeCategory = document.querySelector('.cat-btn.active').innerText;
            if (activeCategory === 'Sparade') {
                renderArticles('Sparade');
            }
        }

        function renderArticles(categoryFilter) {
            const container = document.getElementById('news-container');
            container.innerHTML = '';

            let filtered = allArticles;
            
            if (categoryFilter === 'Sparade') {
                filtered = allArticles.filter(a => savedArticles.includes(a.url));
                if (filtered.length === 0) {
                    container.innerHTML = '<p style="text-align:center; color: var(--text-muted); padding: 40px;">Du har inga sparade nyheter än.</p>';
                    return;
                }
            } else if (categoryFilter !== 'Alla') {
                filtered = allArticles.filter(a => {
                    const cat = (a.category || '').toLowerCase();
                    const title = (a.title || '').toLowerCase();
                    const summary = (a.summary || '').toLowerCase();
                    const fullText = `${cat} ${title} ${summary}`;
                    const filterLower = categoryFilter.toLowerCase();

                    if (cat === filterLower) return true;

                    // Den nya massiva intelligensfliken
                    if (filterLower === 'ai utveckling') {
                        // Inkluderar allt kring AI, AGI, SI och humanoider (inklusive Optimus & 1X Neo)
                        const isAI = /\b(ai|agi|asi|si|humanoid|humanoider|robotik|robot|optimus|1x|neo|figure|boston dynamics|unitree|llm|gpt|openai|gemini|claude|anthropic|artificiell intelligens|superintelligens|syntetisk intelligens)\b/i.test(fullText);
                        
                        // Blockerar nyheter om militära missiler för att undvika "ballistisk robot"-fällan
                        const isMilitaryMissile = /\b(ballistisk|kryssningsrobot|luftvärnsrobot|stridsinsats|missil|robotattack)\b/i.test(fullText);

                        return isAI && !isMilitaryMissile;
                    }

                    return false;
                });

                if (filtered.length === 0) {
                    container.innerHTML = `<p style="text-align:center; color: var(--text-muted); padding: 40px;">Inga artiklar hittades i kategorin "${categoryFilter}" just nu.</p>`;
                    return;
                }
            }

            filtered.forEach(article => {
                const isSaved = savedArticles.includes(article.url);
                const saveBtnClass = isSaved ? 'save-btn saved' : 'save-btn';
                const saveBtnText = isSaved ? '⭐ Sparad' : '🔖 Spara';
                const articleId = btoa(article.url);
                
                const imageHTML = article.image_url 
                    ? `<img src="${article.image_url}" alt="Omslagsbild" class="card-image" onerror="this.style.display='none'">` 
                    : '';
                
                const whyItMattersHTML = article.why_it_matters
                    ? `<div class="why-it-matters">💡 ${article.why_it_matters}</div>`
                    : '';

                const cardHTML = `
                    <div class="news-card" id="${articleId}">
                        ${imageHTML}
                        <div class="card-content">
                            <div class="card-meta">
                                <span class="category-pill">${article.category || 'Allmänt'}</span>
                                <span>${article.source}</span>
                            </div>
                            <h2 class="news-title">${article.title}</h2>
                            <div class="news-summary">${parseMarkdown(article.summary)}</div>
                            ${whyItMattersHTML}
                            
                            <div class="card-actions">
                                <a href="${article.url}" target="_blank" class="read-more">Läs artikel →</a>
                                <button class="${saveBtnClass}" onclick="toggleSave('${article.url}', this)">${saveBtnText}</button>
                            </div>
                        </div>
                    </div>
                `;
                container.innerHTML += cardHTML;
            });
        }

        window.onclick = function(event) {
            const modal = document.getElementById('settings-modal');
            if (event.target === modal) {
                modal.style.display = 'none';
            }
        }

        // Starta
        fetchWeather();
        fetchNews();
    </script>
</body>
</html>
