<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SI News - Autonom Nyhetsportal</title>
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: #151c2c;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --accent: #10b981;
      --accent-hover: #059669;
      --border: #1f293d;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 2rem 1rem;
      max-width: 1200px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1rem;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .brand { font-size: 1.5rem; font-weight: 700; color: var(--accent); }
    .last-updated { font-size: 0.85rem; color: var(--text-muted); }

    .nav-tabs {
      display: flex;
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .tab-btn {
      background: var(--card-bg);
      color: var(--text-muted);
      border: 1px solid var(--border);
      padding: 0.6rem 1.2rem;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .tab-btn:hover { color: var(--text-main); border-color: var(--accent); }
    .tab-btn.active {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
    }

    .news-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.5rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card-meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      color: var(--accent);
      margin-bottom: 0.8rem;
      font-weight: 600;
    }

    .card-title {
      font-size: 1.15rem;
      font-weight: 600;
      margin-bottom: 0.8rem;
      line-height: 1.4;
    }

    .card-summary {
      font-size: 0.95rem;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 1.2rem;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .card-link {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
    }

    .card-link:hover { text-decoration: underline; }

    .loading {
      text-align: center;
      color: var(--text-muted);
      grid-column: 1 / -1;
      padding: 3rem 0;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">🟢 SI NEWS</div>
    <div class="last-updated" id="updated-time">Laddar...</div>
  </header>

  <div class="nav-tabs">
    <button class="tab-btn active" id="tab-today" onclick="switchTab('today')">Dagens Topp 20</button>
    <button class="tab-btn" id="tab-archive" onclick="switchTab('archive')">Historik</button>
  </div>

  <main class="news-grid" id="news-container">
    <div class="loading">Hämtar nyheter...</div>
  </main>

  <script>
    let currentTab = 'today';

    async function loadNews(tab) {
      const container = document.getElementById('news-container');
      const timeDisplay = document.getElementById('updated-time');
      container.innerHTML = '<div class="loading">Hämtar nyheter...</div>';

      const endpoint = tab === 'today' ? 'news.json' : 'archive.json';

      try {
        const response = await fetch(`./${endpoint}?t=${new Date().getTime()}`);
        if (!response.ok) throw new Error('Kunde inte ladda data');
        
        const data = await response.json();
        timeDisplay.textContent = `Senast uppdaterad: ${data.updated_at || 'Okänt'}`;
        
        container.innerHTML = '';

        if (!data.articles || data.articles.length === 0) {
          container.innerHTML = '<div class="loading">Inga nyheter tillgängliga ännu.</div>';
          return;
        }

        data.articles.forEach(article => {
          const card = document.createElement('article');
          card.className = 'card';
          card.innerHTML = `
            <div>
              <div class="card-meta">
                <span>${article.category || 'Allmänt'}</span>
                <span>${article.source || ''}</span>
              </div>
              <h2 class="card-title">${article.title}</h2>
              <p class="card-summary">${article.summary}</p>
            </div>
            <div class="card-footer">
              <span>${article.date || 'Idag'}</span>
              <a href="${article.url}" target="_blank" class="card-link">Läs artikel &rarr;</a>
            </div>
          `;
          container.appendChild(card);
        });

      } catch (err) {
        container.innerHTML = `<div class="loading">Fel vid inläsning av ${tab === 'today' ? 'dagens nyheter' : 'historik'}. Kör en uppdatering i Actions om arkivet saknas.</div>`;
      }
    }

    function switchTab(tab) {
      currentTab = tab;
      document.getElementById('tab-today').classList.toggle('active', tab === 'today');
      document.getElementById('tab-archive').classList.toggle('active', tab === 'archive');
      loadNews(tab);
    }

    // Ladda Dagens Topp 20 som standard
    loadNews('today');
  </script>
</body>
</html>
